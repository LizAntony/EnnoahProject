<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Schedule Meeting</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    label { display:block; margin-top: 12px; }
    input, textarea { width: 100%; padding: 8px; }
    .btn { margin-top: 16px; background: #2b6cb0; color: #fff; padding: 8px 12px; border: 0; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Schedule a new meeting</h1>
  <form method="post">
    <label>Title
      <input type="text" name="title" placeholder="Project sync">
    </label>
    <label>Organizer email
      <input type="email" name="organizer_email" required>
    </label>
    <label>Attendee email
      <input type="email" name="attendee_email" required>
    </label>
    <label>Start time
      <input type="datetime-local" name="start_time" required>
    </label>
    <label>End time
      <input type="datetime-local" name="end_time" required>
    </label>
    <label>External conferencing link (optional)
      <input type="url" name="external_link" placeholder="https://teams.microsoft.com/... or https://zoom.us/...">
    </label>
    <label>Notes (optional)
      <textarea name="notes" rows="4" placeholder="Agenda, materials, etc."></textarea>
    </label>
    <button class="btn" type="button" onclick="window.location.href='/EnnoahProject/Project/meetinglist.html'">
    Create
</button>

  </form>
</body>
</html>
