<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Schedule Meeting</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    label { display:block; margin-top: 12px; }
    input, textarea { width: 100%; padding: 8px; }
    .btn { margin-top: 16px; background: #2b6cb0; color: #fff; padding: 8px 12px; border: 0; border-radius: 4px; cursor: pointer; }
  .homepage-link a {
    font-family: "Cormorant Garamond", serif;
    font-size: 1rem;
    text-decoration: none;
    color: #2b2b2b;
    padding: 0.4rem 0.8rem;
    border: 1px solid #d3b58a;
    border-radius: 4px;
    transition: all 0.3s ease;
  }

  .homepage-link a:hover {
    background: #d3b58a;
    color: #fff;
  }
.header-row {
    display: flex;
    justify-content: space-between; /* pushes HomePage to the right */
    align-items: center;            /* keeps both vertically aligned */
    width: 100%;
    margin-bottom: 20px;
}
  </style>
</head>
<body>
 <div class="header-row">
    <h1>Schedule a new meeting</h1>

    <div class="homepage-link">
        <a href="index.html">HomePage</a>
    </div>
</div>
  <form method="post">
    <label>Title
      <input type="text" name="title" placeholder="Project sync">
    </label>
    <label>Organizer email
      <input type="email" name="organizer_email" required>
    </label>
    <label>Attendee email
      <input type="email" name="attendee_email" required>
    </label>
    <label>Start time
      <input type="datetime-local" name="start_time" required>
    </label>
    <label>End time
      <input type="datetime-local" name="end_time" required>
    </label>
    <label>External conferencing link (optional)
      <input type="url" name="external_link" placeholder="https://teams.microsoft.com/... or https://zoom.us/...">
    </label>
    <label>Notes (optional)
      <textarea name="notes" rows="4" placeholder="Agenda, materials, etc."></textarea>
    </label>
<button class="btn" type="button" onclick="createGoogleEvent()">
    Create
</button>
  </form>
  <script>
function createGoogleEvent() {
    const title = encodeURIComponent(document.querySelector('input[name="title"]').value);
    const start = document.querySelector('input[name="start_time"]').value.replace(/[-:]/g, "").replace(".000", "");
    const end = document.querySelector('input[name="end_time"]').value.replace(/[-:]/g, "").replace(".000", "");
    const details = encodeURIComponent(document.querySelector('textarea[name="notes"]').value);
    const link = encodeURIComponent(document.querySelector('input[name="external_link"]').value);

    const url =
      `https://calendar.google.com/calendar/render?action=TEMPLATE` +
      `&text=${title}` +
      `&dates=${start}/${end}` +
      `&details=${details}%0A${link}`;

    window.open(url, "_blank");
}
</script>

</body>
</html>
