{% extends "menu.html" %}

{% block content %}

<h1 class="events-title">Events</h1>

<div class="events-container">
    {% for event in events %}
        <div class="event-card">
            <h2>{{ event.title }}</h2>
            <p class="event-date">{{ event.date }}</p>
            <p class="event-sponsor">{{ event.sponsor }}</p>
            <p class="event-time">{{ event.time }}</p>
        </div>
    {% endfor %}
</div>

{% endblock %}
