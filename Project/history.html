{% extends "menu.html" %}

{% block content %}

<h2>Order History</h2>

<div id="history-list"></div>
<script>
    const productPrices = {
        "Garden Fresh": 4.99,
        "Morning Glow Smoothie": 5.99,
        "Ocean Vitality Grilled Fish": 12.49,
        "Wholesome Bowl Quinoa": 8.99,
        "Comfort Nourish Soup": 6.49
    };

    function loadHistory() {
        const history = JSON.parse(localStorage.getItem("orderHistory")) || [];
        const container = document.getElementById("history-list");

        if (history.length === 0) {
            container.innerHTML = "<p>No past orders found.</p>";
            return;
        }

        // ⭐ Show newest orders first
        history.reverse().forEach(order => {
            const div = document.createElement("div");
            div.classList.add("history-block");

            let rows = "";
            let orderTotal = 0;

            order.items.forEach(i => {
                const price = productPrices[i.name] || 0;
                const lineTotal = price * i.qty;
                orderTotal += lineTotal;

                rows += `
                    <tr>
                        <td>${i.name}</td>
                        <td>${i.qty}</td>
                        <td>$${price.toFixed(2)}</td>
                        <td>$${lineTotal.toFixed(2)}</td>
                    </tr>
                `;
            });

            div.innerHTML = `
                <h3>Order on ${order.date}</h3>

                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows}
                    </tbody>
                </table>

                <p class="order-total"><strong>Total Paid: $${orderTotal.toFixed(2)}</strong></p>
            `;

            container.appendChild(div);
        });
    }

    document.addEventListener("DOMContentLoaded", loadHistory);
</script>

{% endblock %}
