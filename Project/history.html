<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order History</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .history-block {
            background: white;
            padding: 16px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }

        .order-total {
            margin-top: 10px;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>

    <h2>Order History</h2>

    <div id="history-list"></div>

    <script>
        const productPrices = {
            "Garden Fresh": 4.99,
            "Morning Glow Smoothie": 5.99,
            "Ocean Vitality Grilled Fish": 12.49,
            "Wholesome Bowl Quinoa": 8.99,
            "Comfort Nourish Soup": 6.49
        };

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem("orderHistory")) || [];
            const container = document.getElementById("history-list");

            if (history.length === 0) {
                container.innerHTML = "<p>No past orders found.</p>";
                return;
            }

            // Show newest first
            history.slice().reverse().forEach(order => {
                const div = document.createElement("div");
                div.classList.add("history-block");

                let rows = "";
                let orderTotal = 0;

                order.items.forEach(i => {
                    const price = productPrices[i.name] || 0;
                    const lineTotal = price * i.qty;
                    orderTotal += lineTotal;

                    rows += `
                        <tr>
                            <td>${i.name}</td>
                            <td>${i.qty}</td>
                            <td>$${price.toFixed(2)}</td>
                            <td>$${lineTotal.toFixed(2)}</td>
                        </tr>
                    `;
                });

                div.innerHTML = `
                    <h3>Order on ${order.date}</h3>

                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>Qty</th>
                                <th>Price</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>

                    <p class="order-total"><strong>Total Paid: $${orderTotal.toFixed(2)}</strong></p>
                `;

                container.appendChild(div);
            });
        }

        document.addEventListener("DOMContentLoaded", loadHistory);
    </script>

</body>
</html>
